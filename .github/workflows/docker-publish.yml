name: Build and push Docker image

# Pushes to main (and PRs) build the image as a validation check but do NOT
# publish it. Images are pushed to GHCR only when a version tag (v*) is pushed,
# so a release is the single thing that creates a package version.
on:
  push:
    branches: [main]   # build-only (validation)
    tags: ['v*']       # build AND publish the release image
  pull_request:        # build-only (validation)
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # guibibi/tordownloader

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only authenticate when we're actually publishing (a tag). Validation
      # builds don't push, so they need no registry login — and this avoids a
      # failed login on pull requests from forks (no package-write token).
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # branch/sha give validation builds a local tag name (never pushed,
          # since push is gated to tags below). A version tag publishes :vX.Y.Z
          # and moves :latest to it.
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build (and push on a version tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          # Validation builds are single-arch for speed; a release builds both.
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
