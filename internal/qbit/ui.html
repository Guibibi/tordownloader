<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tordownloader</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --panel2: #1f232c; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #4f8cff;
    --torbox: #b07cff; --local: #4f8cff; --done: #36c98b; --error: #ff5f6d; --queued: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 18px 24px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .ver { color: var(--muted); font-size: 12px; }
  header .stats { margin-left: auto; color: var(--muted); font-size: 13px; }
  header .stats b { color: var(--text); font-weight: 600; }
  main { padding: 16px 24px; max-width: 1100px; margin: 0 auto; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .row1 { display: flex; align-items: center; gap: 10px; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
  }
  .badge.torbox { background: rgba(176,124,255,.15); color: var(--torbox); }
  .badge.local  { background: rgba(79,140,255,.15); color: var(--local); }
  .badge.done   { background: rgba(54,201,139,.15); color: var(--done); }
  .badge.error  { background: rgba(255,95,109,.15); color: var(--error); }
  .badge.queued { background: rgba(107,114,128,.18); color: #aab2c0; }
  .badge.cached { background: rgba(245,196,75,.15); color: #f5c44b; }
  .group-head {
    color: var(--muted); font-size: 12px; cursor: pointer; user-select: none;
    margin: 18px 0 8px; display: flex; align-items: center; gap: 6px;
  }
  .group-head:hover { color: var(--text); }
  .group-head .caret { transition: transform .15s ease; display: inline-block; }
  .group-head.collapsed .caret { transform: rotate(-90deg); }
  .row1.expandable { cursor: pointer; }
  .row1 .caret { color: var(--muted); font-size: 11px; transition: transform .15s ease; display: inline-block; }
  .row1 .caret.collapsed { transform: rotate(-90deg); }
  .files { margin: 10px 0 2px; border-top: 1px solid var(--border); padding-top: 8px; }
  .file { display: flex; align-items: center; gap: 10px; padding: 3px 0; font-size: 12px; }
  .file .ficon { width: 14px; text-align: center; }
  .file.done .ficon { color: var(--done); }
  .file.pending .ficon { color: var(--muted); }
  .file .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file.pending .fname { color: var(--muted); }
  .file .fsize { color: var(--muted); white-space: nowrap; }
  .meta { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin: 8px 0 10px; }
  .meta b { color: var(--text); font-weight: 600; }
  .bar { height: 8px; background: var(--panel2); border-radius: 6px; overflow: hidden; display: flex; }
  .bar .seg { height: 100%; transition: width .4s ease; }
  .bar .seg.torbox { background: var(--torbox); }
  .bar .seg.local  { background: var(--local); }
  .bar .seg.done   { background: var(--done); }
  .bar .seg.error  { background: var(--error); }
  .barlabel { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .barlabel .pct { color: var(--text); font-weight: 600; }
  .errmsg { color: var(--error); font-size: 12px; margin-top: 8px; word-break: break-word; }
  .stall { color: #f0a23b; font-size: 12px; margin-top: 8px; }
  .legend { color: var(--muted); font-size: 12px; display: flex; gap: 14px; margin-top: 4px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .dim { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>tordownloader</h1>
  <span class="ver" id="ver"></span>
  <div class="stats">
    <span id="counts"></span> &nbsp;•&nbsp; <b id="speed">0 B/s</b> down
  </div>
</header>
<main>
  <div class="legend">
    <span><i style="background:var(--torbox)"></i>TorBox caching</span>
    <span><i style="background:var(--local)"></i>Local download</span>
    <span><i style="background:var(--done)"></i>Complete</span>
  </div>
  <div id="list" style="margin-top:14px"></div>
</main>

<script>
const fmtSize = b => {
  if (!b || b < 0) return "0 B";
  const u = ["B","KB","MB","GB","TB"]; let i = 0; let n = b;
  while (n >= 1024 && i < u.length-1) { n /= 1024; i++; }
  return n.toFixed(n < 10 && i > 0 ? 1 : 0) + " " + u[i];
};
const fmtSpeed = b => b > 0 ? fmtSize(b) + "/s" : "—";
const fmtEta = s => {
  if (s == null || s < 0) return "—";
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s/60) + "m " + (s%60) + "s";
  const h = Math.floor(s/3600); return h + "h " + Math.floor((s%3600)/60) + "m";
};
const fmtAge = ts => {
  if (!ts) return "";
  const s = Math.floor(Date.now()/1000) - ts;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
};
const esc = s => { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; };

function bar(t) {
  // Two-phase bar: TorBox cache (first half) then local download (second half).
  if (t.phase === "done")  return `<div class="bar"><div class="seg done" style="width:100%"></div></div>`;
  if (t.phase === "error") {
    const w = Math.round((0.5*t.torbox_progress + 0.5*t.local_progress)*100);
    return `<div class="bar"><div class="seg error" style="width:${w}%"></div></div>`;
  }
  const tb = Math.round(t.torbox_progress*50);
  const lo = Math.round(t.local_progress*50);
  return `<div class="bar">
    <div class="seg torbox" style="width:${tb}%"></div>
    <div class="seg local" style="width:${lo}%"></div>
  </div>`;
}

// Module-level mirrors of the configured stall timeouts (seconds), set on each
// poll. 0 disables the corresponding countdown. Cached releases get
// cachedStallTimeout (they're only waiting for TorBox to surface bytes it has),
// fetches with real progress get the long progressStallTimeout (thin swarms
// recover), and 0% fetches get the short stallTimeout.
let stallTimeout = 0;
let progressStallTimeout = 0;
let cachedStallTimeout = 0;

// Hashes whose per-file breakdown is expanded, and a cache of the last rendered
// file list per hash so re-renders (every poll) don't flash a loading state.
const expanded = new Set();
const filesCache = {};

function fileRow(f) {
  const cls = f.done ? "done" : "pending";
  return `<div class="file ${cls}">
    <span class="ficon">${f.done ? "✓" : "○"}</span>
    <span class="fname" title="${esc(f.path)}">${esc(f.name)}</span>
    <span class="fsize">${fmtSize(f.size)}</span>
  </div>`;
}

async function loadFiles(hash) {
  try {
    const r = await fetch("/ui/torrents/files?hash=" + encodeURIComponent(hash), { cache: "no-store" });
    if (!r.ok) return;
    const d = await r.json();
    const html = (d.files || []).map(fileRow).join("") || `<div class="dim">No files.</div>`;
    filesCache[hash] = html;
    const el = document.getElementById("files-" + hash);
    if (el) el.innerHTML = html; // only patch if still expanded/present
  } catch (e) { /* leave the cached/placeholder content in place */ }
}

// stallRemaining returns the seconds a stalled TorBox fetch has left before it's
// failed, or null when no countdown applies (not fetching, moving bytes, queued
// on TorBox, or stall-failing disabled). A 60s grace avoids flagging brand-new
// or just-advanced torrents.
function stallRemaining(t) {
  if (t.phase !== "torbox") return null;
  const timeout = t.cached ? cachedStallTimeout
                : (t.torbox_progress > 0 ? progressStallTimeout : stallTimeout);
  if (timeout <= 0) return null;
  if (t.torbox_state === "queued" || t.dlspeed > 0 || !t.progress_at) return null;
  const elapsed = Math.floor(Date.now()/1000) - t.progress_at;
  if (elapsed < 60) return null;
  return timeout - elapsed;
}

function card(t) {
  const pct = Math.round(t.progress*100);
  let detail = "";
  if (t.phase === "torbox") {
    const parts = [`TorBox ${Math.round(t.torbox_progress*100)}%`];
    if (t.seeds || t.peers) parts.push(`▲ ${t.seeds} · ▼ ${t.peers}`);
    if (t.dlspeed > 0) parts.push(fmtSpeed(t.dlspeed));
    if (t.eta >= 0) parts.push(`ETA ${fmtEta(t.eta)}`);
    detail = parts.join(" · ");
  } else if (t.phase === "local") {
    detail = `Disk ${Math.round(t.local_progress*100)}% · ${fmtSpeed(t.dlspeed)} · ETA ${fmtEta(t.eta)}`;
  }
  const age = fmtAge(t.added_on);
  const stall = stallRemaining(t);
  const stallMsg = stall === null ? ""
    : (stall <= 0 ? "⚠ no progress — failing…"
                  : `⚠ no progress — fails in ${fmtEta(stall)}`);
  // Files exist once content is on TorBox and we've recorded them (local/done).
  const expandable = t.phase === "local" || t.phase === "done";
  const isOpen = expanded.has(t.hash);
  return `<div class="card">
    <div class="row1${expandable ? " expandable" : ""}" ${expandable ? `data-toggle="${t.hash}"` : ""}>
      ${expandable ? `<span class="caret${isOpen ? "" : " collapsed"}">▾</span>` : ""}
      <span class="name" title="${esc(t.name)}">${esc(t.name)}</span>
      ${t.cached ? `<span class="badge cached" title="Already on TorBox when grabbed">⚡ cached</span>` : ""}
      <span class="badge ${t.phase}">${esc(t.state_label)}</span>
    </div>
    <div class="meta">
      <span><b>${fmtSize(t.size)}</b></span>
      ${t.category ? `<span>${esc(t.category)}</span>` : ""}
      ${detail ? `<span class="dim">${detail}</span>` : ""}
      ${age ? `<span class="dim" title="added">${age}</span>` : ""}
    </div>
    ${bar(t)}
    <div class="barlabel"><span>${esc(t.state_label)}</span><span class="pct">${pct}%</span></div>
    ${stallMsg ? `<div class="stall">${stallMsg}</div>` : ""}
    ${t.error ? `<div class="errmsg">${esc(t.error)}</div>` : ""}
    ${isOpen ? `<div class="files" id="files-${t.hash}">${filesCache[t.hash] || `<div class="dim">Loading files…</div>`}</div>` : ""}
  </div>`;
}

// Active phases sort to the top; completed torrents collapse into their own group.
const PHASE_RANK = { torbox: 0, local: 0, queued: 1, error: 2, done: 3 };
let doneCollapsed = true;

function render(ts) {
  const list = document.getElementById("list");
  if (!ts.length) { list.innerHTML = `<div class="empty">No torrents yet.</div>`; return; }
  const active = ts.filter(t => t.phase !== "done");
  const done = ts.filter(t => t.phase === "done");
  active.sort((a, b) => (PHASE_RANK[a.phase] - PHASE_RANK[b.phase]) || (b.added_on - a.added_on));
  done.sort((a, b) => b.added_on - a.added_on);

  let html = active.map(card).join("");
  if (done.length) {
    html += `<div class="group-head${doneCollapsed ? " collapsed" : ""}" id="doneHead">
      <span class="caret">▾</span> Completed (${done.length})
    </div>
    <div id="doneList" style="display:${doneCollapsed ? "none" : "block"}">${done.map(card).join("")}</div>`;
  }
  list.innerHTML = html;
  const head = document.getElementById("doneHead");
  if (head) head.onclick = () => { doneCollapsed = !doneCollapsed; render(ts); };
  // Wire per-card file toggles, then refresh any expanded breakdowns.
  list.querySelectorAll("[data-toggle]").forEach(el => {
    el.onclick = () => {
      const h = el.getAttribute("data-toggle");
      if (expanded.has(h)) expanded.delete(h); else expanded.add(h);
      render(ts);
    };
  });
  expanded.forEach(h => loadFiles(h));
}

async function tick() {
  try {
    const r = await fetch("/ui/torrents", { cache: "no-store" });
    const d = await r.json();
    document.getElementById("ver").textContent = d.version || "";
    document.getElementById("speed").textContent = fmtSpeed(d.dlspeed) || "0 B/s";
    stallTimeout = d.stall_timeout || 0;
    progressStallTimeout = d.progress_stall_timeout || 0;
    cachedStallTimeout = d.cached_stall_timeout || 0;
    const ts = d.torrents || [];
    const active = ts.filter(t => t.phase === "torbox" || t.phase === "local").length;
    const done = ts.filter(t => t.phase === "done").length;
    document.getElementById("counts").textContent =
      `${ts.length} torrent${ts.length===1?"":"s"} · ${active} active · ${done} done`;
    render(ts);
  } catch (e) {
    document.getElementById("counts").textContent = "connection lost…";
  }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
