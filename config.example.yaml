# tordownloader configuration.
# All values shown are the built-in defaults; copy to config.yaml and override as needed.
# Provide the TorBox API key via the TORBOX_API_KEY env var (keep it out of git).

server:
  listen_addr: "0.0.0.0:6500"      # bind address for the qBittorrent-emulation API

torbox:
  # api_key: ""                    # prefer the TORBOX_API_KEY env var instead of putting it here
  base_url: "https://api.torbox.app"
  max_active_slots: 3              # Essential plan = 3 concurrent download slots
  cache_check: true                # check cached availability on add (fail-fast)
  poll_interval: 10s               # how often to poll TorBox /mylist
  max_requests_per_min: 280        # cap on all TorBox API calls (general limit is 300/min); 0 disables

download:
  root: "/downloads"               # shared with Sonarr/Radarr, mapped identically across containers
  incomplete_subdir: ".incomplete" # partial downloads land here, then atomic-move into place
  parallel_files: 4                # concurrent file downloads within one torrent
  parallel_torrents: 3             # torrents pulled to disk at once (one huge grab won't block cached episodes behind it)

database:
  path: "data/tordownloader.db"    # SQLite state file

failure:
  # A torrent is abandoned with an error (so Sonarr/Radarr blacklists the release
  # and grabs another) only when it makes no headway — never just for being slow.
  # How long a stall is tolerated depends on what's at stake: a fetch still at 0%
  # is cheap to abandon, but one with real progress usually finishes once its thin
  # swarm recovers a seed (often a matter of hours), so it gets far more patience.
  # While stalled, TorBox is periodically nudged to reannounce so returning seeds
  # are picked up promptly.
  stall_timeout: 20m               # ERROR after this long stalled at 0% (no bytes moving, progress not climbing). <=0 disables
  progress_stall_timeout: 2h       # much longer grace once a fetch has made real progress (>0%); <=0 disables for those
  cached_stall_timeout: 30m        # grace for cached releases (they only wait for TorBox to surface bytes it already has); <=0 disables for cached
  reannounce_interval: 5m          # nudge a stalled fetch with a TorBox reannounce this often; <=0 disables
  timeout: 0                       # optional absolute cap from when it becomes TorBox-active; 0 disables (bounds slow torrents holding a slot)
  error_retention: 168h            # delete settled ERROR torrents (row + partial files) after sitting this long; negative disables

# Sonarr/Radarr failure push-back (strongly recommended). Sonarr never runs
# failed-download handling from qBittorrent states — a torrent we report as
# "error" only shows a warning in its queue and sits there forever; the release
# is not blocklisted and no alternative is grabbed. With instances configured
# here, tordownloader closes the loop itself: on failure it removes the queue
# item via the *arr's own API with blocklist=true, which makes the *arr
# blocklist the release, delete the torrent, and search for a replacement.
# Instead of this section you can also set TD_SONARR_URL + TD_SONARR_API_KEY
# and/or TD_RADARR_URL + TD_RADARR_API_KEY.
# arr:
#   - name: sonarr
#     url: "http://sonarr:8989"    # base path OK, e.g. http://host:8989/sonarr
#     api_key: "your-sonarr-key"   # Sonarr → Settings → General → API Key
#   - name: radarr
#     url: "http://radarr:7878"
#     api_key: "your-radarr-key"

log:
  level: "info"                    # debug | info | warn | error
  format: "text"                   # text | json
