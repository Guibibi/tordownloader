<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="320" height="260" role="img" aria-label="A happy cardboard box licking its lips while video files drop into it">
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3BE87"/>
      <stop offset="1" stop-color="#E3A469"/>
    </linearGradient>
    <g id="file">
      <rect x="-16" y="-20" width="32" height="40" rx="5" fill="#FFFFFF" stroke="#2B1D14" stroke-width="3"/>
      <path d="M-5 -8 L8 0 L-5 8 Z" fill="#7C5CFF"/>
    </g>
    <path id="spark" d="M0 -7 Q1 -1 7 0 Q1 1 0 7 Q-1 1 -7 0 Q-1 -1 0 -7 Z" fill="#FFC93C"/>
  </defs>

  <!-- shadow -->
  <ellipse cx="160" cy="238" rx="96" ry="8" fill="#000" opacity="0.12"/>

  <!-- falling files -->
  <g opacity="0.35" stroke="#7C5CFF" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="8" x2="120" y2="22"/>
    <line x1="180" y1="2" x2="180" y2="12"/>
    <line x1="214" y1="30" x2="214" y2="42"/>
  </g>
  <use href="#file" transform="translate(122 52) rotate(-14)"/>
  <use href="#file" transform="translate(178 34) rotate(9)"/>
  <use href="#file" transform="translate(212 78) rotate(22) scale(0.8)"/>
  <use href="#spark" transform="translate(84 44)"/>
  <use href="#spark" transform="translate(248 50) scale(0.8)"/>
  <use href="#spark" transform="translate(150 6) scale(0.6)"/>

  <!-- inside + flaps -->
  <polygon points="88,110 232,110 240,122 80,122" fill="#9C6B3E" stroke="#2B1D14" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="80,122 88,110 48,86 36,104" fill="#F6CA98" stroke="#2B1D14" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="240,122 232,110 272,86 284,104" fill="#F6CA98" stroke="#2B1D14" stroke-width="3" stroke-linejoin="round"/>

  <!-- body -->
  <rect x="80" y="120" width="160" height="110" rx="12" fill="url(#front)" stroke="#2B1D14" stroke-width="3"/>
  <rect x="150" y="121" width="20" height="28" fill="#F8DDB6" opacity="0.8"/>

  <!-- face -->
  <ellipse cx="112" cy="190" rx="11" ry="6" fill="#FF8FA3" opacity="0.65"/>
  <ellipse cx="208" cy="190" rx="11" ry="6" fill="#FF8FA3" opacity="0.65"/>
  <circle cx="130" cy="170" r="11" fill="#2B1D14"/>
  <circle cx="190" cy="170" r="11" fill="#2B1D14"/>
  <circle cx="126" cy="166" r="4" fill="#FFF"/>
  <circle cx="186" cy="166" r="4" fill="#FFF"/>
  <circle cx="134" cy="174" r="1.8" fill="#FFF"/>
  <circle cx="194" cy="174" r="1.8" fill="#FFF"/>
  <!-- tongue, licking the corner of the smile -->
  <path d="M166 190 Q177 189 179 199 Q179 207 171 206 Q164 204 164 196 Z" fill="#FF6F8E" stroke="#2B1D14" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M146 186 Q160 199 174 186" fill="none" stroke="#2B1D14" stroke-width="4" stroke-linecap="round"/>

  <!-- little feet -->
  <ellipse cx="118" cy="232" rx="14" ry="6" fill="#C98A52" stroke="#2B1D14" stroke-width="3"/>
  <ellipse cx="202" cy="232" rx="14" ry="6" fill="#C98A52" stroke="#2B1D14" stroke-width="3"/>
</svg>
